name: barberia
description: "Multi-platform barber shop booking app: browse services, select date & time, localized (es/en), reminders, themed & accessible UI."
publish_to: "none"

version: 1.1.2

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.2.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_crashlytics: ^5.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
