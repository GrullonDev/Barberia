<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Clipz Barbería</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script defer src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=false"></script>

    <style>
        :root {
            --primary: #c9a050; /* Dorado elegante */
            --primary-dark: #b08a40;
            --secondary: #1a1a1a;
            --bg-dark: #0f0f0f;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
            --success: #4caf50;
            --error: #f44336;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Fondo Animado */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            z-index: -1;
        }

        .bg-blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201, 160, 80, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* Contenedor Principal */
        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Tarjeta */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        /* Estado */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-active { background: rgba(76, 175, 80, 0.2); color: #81c784; }
        .status-canceled { background: rgba(244, 67, 54, 0.2); color: #e57373; }

        /* Detalles */
        .service-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .appointment-id {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid var(--glass-border);
            padding-top: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            background: rgba(201, 160, 80, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .info-content .label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-content .value {
            font-weight: 500;
            font-size: 1rem;
        }

        /* Botón */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            border-radius: 14px;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(201, 160, 80, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--text-dim);
        }

        /* Loading */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(201, 160, 80, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        footer {
            margin-top: 40px;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { width: 95%; }
            .card { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-blob"></div>

    <div class="container">
        <div class="logo">CLIPZ</div>

        <div id="content">
            <div id="loader">
                <div class="spinner"></div>
                <p>Buscando reserva...</p>
            </div>
        </div>

        <footer>
            &copy; 2024 Clipz Barber Shop. Todos los derechos reservados.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Esperar a que Firebase se inicialice
            const checkFirebase = setInterval(() => {
                if (typeof firebase !== 'undefined') {
                    clearInterval(checkFirebase);
                    initApp();
                }
            }, 100);
        });

        async function initApp() {
            const db = firebase.firestore();
            
            // Obtener ID de la reserva de la URL
            const pathParts = window.location.pathname.split('/');
            let bookingId = pathParts[pathParts.length - 1];
            
            if (!bookingId || bookingId === 'index.html' || bookingId === '') {
                const params = new URLSearchParams(window.location.search);
                bookingId = params.get('appt');
            }
            
            // Fallback para rutas tipo /booking/ID si hosting no hace rewrite correcto
            if (!bookingId && pathParts.includes('booking')) {
                bookingId = pathParts[pathParts.indexOf('booking') + 1];
            }

            if (!bookingId) {
                showError("No se encontró ID de reserva. Escanea el QR de nuevo.");
                return;
            }

            try {
                const doc = await db.collection('bookings').doc(bookingId).get();
                
                if (!doc.exists) {
                    showError("La reserva no existe o ha caducado.");
                    return;
                }

                const data = doc.data();
                renderBooking(bookingId, data);
            } catch (error) {
                console.error(error);
                showError("Error al conectar con el servidor.");
            }
        }

        function renderBooking(id, data) {
            const content = document.getElementById('content');
            const date = data.date.toDate();
            const formattedDate = date.toLocaleDateString('es-ES', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            const formattedTime = date.toLocaleTimeString('es-ES', { 
                hour: '2-digit', minute: '2-digit' 
            });

            const statusClass = data.status === 'canceled' ? 'status-canceled' : 'status-active';
            const statusLabel = data.status === 'canceled' ? 'Cancelada' : 'Confirmada';
            const canCancel = data.status === 'active' && date > new Date();

            content.innerHTML = `
                <div class="card">
                    <div class="status-badge ${statusClass}">${statusLabel}</div>
                    <h1 class="service-name">${data.serviceName}</h1>
                    <p class="appointment-id">Reserva: APPT-${id.slice(-4).toUpperCase()}</p>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <div class="info-content">
                                <span class="label">Fecha</span>
                                <span class="value">${formattedDate}</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <div class="info-content">
                                <span class="label">Hora</span>
                                <span class="value">${formattedTime}</span>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                            <div class="info-content">
                                <span class="label">Cliente</span>
                                <span class="value">${data.customerName}</span>
                            </div>
                        </div>
                    </div>

                    <a href="https://www.google.com/maps/search/?api=1&query=Av.+Principal+123" target="_blank" class="btn">
                        ¿Cómo llegar?
                    </a>
                    
                    <a href="tel:+123456789" class="btn btn-secondary">
                        Llamar a la barbería
                    </a>

                    ${canCancel ? `
                        <button onclick="confirmCancel('${id}')" class="btn btn-secondary" style="color: var(--error); border-color: rgba(244, 67, 54, 0.2); margin-top: 25px;">
                            Cancelar Cita
                        </button>
                    ` : ''}
                </div>
            `;
        }

        async function confirmCancel(id) {
            if (confirm('¿Estás seguro de que deseas cancelar esta cita? Esta acción no se puede deshacer.')) {
                try {
                    const btn = document.querySelector('button[onclick*="confirmCancel"]');
                    btn.disabled = true;
                    btn.textContent = 'Cancelando...';
                    
                    await firebase.firestore().collection('bookings').doc(id).update({
                        status: 'canceled'
                    });
                    
                    window.location.reload();
                } catch (error) {
                    alert('Error al cancelar la cita. Por favor, intenta de nuevo.');
                    console.error(error);
                }
            }
        }

        function showError(msg) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="card" style="border-color: rgba(244, 67, 54, 0.3)">
                    <div class="info-icon" style="margin: 0 auto 20px; background: rgba(244, 67, 54, 0.1); color: var(--error); width: 60px; height: 60px;">
                        <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h2 style="margin-bottom: 10px;">Vaya...</h2>
                    <p style="color: var(--text-dim); line-height: 1.5;">${msg}</p>
                    <button onclick="window.location.reload()" class="btn btn-secondary">Reintentar</button>
                </div>
            `;
        }
    </script>
</body>
</html>
