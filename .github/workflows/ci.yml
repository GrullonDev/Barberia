name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze, test & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --platform chrome
      # FIREBASE_ENV is compile-time: check staging selection and that an
      # unknown value fails closed instead of falling back to production.
      - run: flutter test test/firebase_environment_test.dart --dart-define=FIREBASE_ENV=staging
      - run: flutter test test/firebase_environment_test.dart --dart-define=FIREBASE_ENV=bogus
      - run: flutter build web --release
      - name: Staging web build contains no production config
        run: |
          flutter build web --release --dart-define=FIREBASE_ENV=staging --dart-define=SHOP_ID=barberia-staging
          grep -q '"barberia-staging"' build/web/main.dart.js
          ! grep -E 'barbershop-ee9c0|956317826330' build/web/main.dart.js

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  functions:
    name: Cloud Functions unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      # Importing main.py validates every function declaration against the
      # pinned firebase-functions SDK (an invalid option fails deployment).
      - run: python -c "import main"
      - run: python -m pytest tests -q

  emulator:
    name: Firestore rules & booking integration (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g firebase-tools@15.28.0
      - run: pip install -r backend/functions/requirements.txt pytest
      - run: >
          firebase emulators:exec --only auth,firestore --project demo-barberia
          "python -m pytest backend/tests -q"
